<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Battery shell -->
  <rect x="20" y="40" width="72" height="48" rx="10" ry="10"
        fill="none" stroke="#3a3a3a" stroke-width="7"/>
  <!-- Battery terminal nub -->
  <rect x="92" y="54" width="10" height="20" rx="3" ry="3"
        fill="#3a3a3a"/>
  <!-- Charge level (green, ~65%) -->
  <rect x="27" y="47" width="41" height="34" rx="5" ry="5"
        fill="#3fbf5a"/>
  <!-- Headset (headband + earcup) glyph over the charge -->
  <path d="M38 78 v-6 a12 12 0 0 1 24 0 v6"
        fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <rect x="34" y="76" width="9" height="13" rx="3" ry="3" fill="#ffffff"/>
  <rect x="53" y="76" width="9" height="13" rx="3" ry="3" fill="#ffffff"/>
</svg>
